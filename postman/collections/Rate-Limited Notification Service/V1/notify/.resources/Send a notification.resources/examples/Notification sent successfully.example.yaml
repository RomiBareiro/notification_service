$kind: http-example
request:
  url: "{{baseUrl}}/V1/notify"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "recipient": "example@example.com",
        "group": "NEWS"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "recipient": "example@example.com",
        "group": "NEWS",
        "timestamp": "0001-01-01T00:00:00Z",
        "message": "success"
      }
order: 1000
